<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>中国象棋 · 蓝高亮10秒 · 悔棋各退5步</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body {
      background: #1a1a1a; min-height: 100vh; display: flex; justify-content: center; align-items: center;
      font-family: '楷体', 'KaiTi', '华文楷体', serif;
    }
    .game-container {
      background: transparent; padding: 10px; display: flex; gap: 30px; align-items: center;
      flex-wrap: wrap; justify-content: center;
    }
    canvas {
      display: block; border-radius: 18px; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      background: #f0d9b5; cursor: pointer; flex-shrink: 0;
    }
    .right-panel {
      display: flex; flex-direction: column; gap: 15px; align-items: center; min-width: 160px;
    }
    .turn-indicator {
      background: #5e3e1e; color: #f9eac3; padding: 8px 12px; border-radius: 50px; font-size: 22px;
      letter-spacing: 2px; box-shadow: inset 0 -3px 0 #2f1f0e, 0 6px 10px black;
      border-bottom: 2px solid #b5914c; width: 100%; text-align: center; margin-bottom: 5px;
    }
    .mode-selector, .difficulty-selector {
      background: #c29e5e; border-radius: 40px; padding: 8px 12px; font-size: 20px; font-weight: bold;
      color: #2b1a0a; border: 2px solid #efd39e; box-shadow: inset 0 -2px 0 #6f4f2e, 0 6px 8px black;
      cursor: pointer; outline: none; width: 100%; text-align: center;
    }
    .action-btn {
      background: #c29e5e; border: none; font-size: 22px; font-family: '楷体', serif; font-weight: bold;
      padding: 8px 0; border-radius: 40px; color: #2b1a0a; box-shadow: 0 8px 0 #6f4f2e, 0 10px 15px black;
      cursor: pointer; transition: 0.08s linear; border: 1px solid #efd39e; letter-spacing: 2px; width: 100%;
    }
    .action-btn:active {
      transform: translateY(7px); box-shadow: 0 2px 0 #5a3f22, 0 8px 12px black;
    }
    .action-btn:disabled {
      opacity: 0.5; transform: none; box-shadow: 0 4px 0 #6f4f2e; cursor: not-allowed;
    }
  </style>
</head>
<body>
<div class="game-container">
  <canvas id="chessCanvas"></canvas>
  <div class="right-panel">
    <div class="turn-indicator" id="turnText">红方走棋</div>
    <select id="modeSelect" class="mode-selector">
      <option value="ai-black" selected>🤖AI执黑</option>
      <option value="ai-red">🤖AI执红</option>
      <option value="human">双人对战</option>
    </select>
    <select id="difficultySelect" class="difficulty-selector">
      <option value="1">🤖初级1层</option>
      <option value="2" selected>🤖中级2层</option>
      <option value="3">🤖高级3层</option>
    </select>
    <button class="action-btn" id="undoBtn">悔棋 (剩5步)</button>
    <button class="action-btn restart-btn" id="restartBtn">新局</button>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('chessCanvas');
  const ctx = canvas.getContext('2d');
  const turnText = document.getElementById('turnText');
  const modeSelect = document.getElementById('modeSelect');
  const difficultySelect = document.getElementById('difficultySelect');
  const undoBtn = document.getElementById('undoBtn');
  const restartBtn = document.getElementById('restartBtn');

  const ROWS = 10, COLS = 9;
  let GRID_SIZE = 56, OFFSET_X = 56, OFFSET_Y = 63;

  let board = [];
  let currentPlayer = 'r';
  let selectedPiece = null;
  let gameOver = false, winner = null;
  let history = [];
  let undoCount = 0;                 // 已使用的悔棋次数
  const MAX_UNDO = 5;               // 最多悔棋5步（各退5步）

  let gameMode = 'ai-black';
  let aiDifficulty = 2;
  let isAIPlaying = false;

  // AI 走子高亮（蓝色，持续10秒）
  let lastMoveInfo = null;
  let highlightTimer = null;

  const MAX_HISTORY = 30;           // 保留足够历史记录

  const MAX_DEPTH = 10;
  let killerMoves = [];
  function initKillers() {
    killerMoves = [];
    for (let d = 0; d <= MAX_DEPTH; d++) killerMoves[d] = [null, null];
  }
  initKillers();

  const pieceValue = {
    'k':10000, 'a':200, 'b':200, 'n':500, 'r':1000, 'c':800, 'p':100
  };

  // ---------- 自适应 (窄边距) ----------
  function resizeCanvas() {
    const marginX = 0.6, marginY = 0.6;
    const maxW = window.innerWidth * 0.9, maxH = window.innerHeight * 0.95;
    const gW = maxW / (8 + 2*marginX), gH = maxH / (9 + 2*marginY);
    GRID_SIZE = Math.floor(Math.min(gW, gH));
    if (GRID_SIZE < 20) GRID_SIZE = 20;
    OFFSET_X = Math.floor(GRID_SIZE * marginX);
    OFFSET_Y = Math.floor(GRID_SIZE * marginY);
    canvas.width = OFFSET_X*2 + 8*GRID_SIZE;
    canvas.height = OFFSET_Y*2 + 9*GRID_SIZE;
    canvas.style.width = canvas.width + 'px';
    canvas.style.height = canvas.height + 'px';
    drawBoard();
  }
  window.addEventListener('resize', resizeCanvas);

  // ---------- 初始化棋盘 ----------
  function initBoard() {
    board = Array(ROWS).fill().map(()=>Array(COLS).fill(null));
    board[0][0]='br'; board[0][1]='bn'; board[0][2]='bb'; board[0][3]='ba'; board[0][4]='bk';
    board[0][5]='ba'; board[0][6]='bb'; board[0][7]='bn'; board[0][8]='br';
    board[2][1]='bc'; board[2][7]='bc';
    board[3][0]='bp'; board[3][2]='bp'; board[3][4]='bp'; board[3][6]='bp'; board[3][8]='bp';
    board[9][0]='rr'; board[9][1]='rn'; board[9][2]='rb'; board[9][3]='ra'; board[9][4]='rk';
    board[9][5]='ra'; board[9][6]='rb'; board[9][7]='rn'; board[9][8]='rr';
    board[7][1]='rc'; board[7][7]='rc';
    board[6][0]='rp'; board[6][2]='rp'; board[6][4]='rp'; board[6][6]='rp'; board[6][8]='rp';
    currentPlayer = 'r';
    selectedPiece = null;
    gameOver = false; winner = null;
    history = [];
    undoCount = 0;
    updateUndoButton();
    turnText.innerText = '红方走棋';
    initKillers();
    clearHighlight();
  }

  function updateUndoButton() {
    const left = MAX_UNDO - undoCount;
    undoBtn.textContent = `悔棋 (剩${left}步)`;
    undoBtn.disabled = (left <= 0);
  }

  // ---------- 蓝色高亮，持续10秒 ----------
  function setMoveHighlight(fromX, fromY, toX, toY) {
    lastMoveInfo = { fromX, fromY, toX, toY, time: Date.now() };
    if (highlightTimer) clearTimeout(highlightTimer);
    highlightTimer = setTimeout(() => {
      lastMoveInfo = null;
      drawBoard();
      highlightTimer = null;
    }, 10000); // 10秒
  }

  function clearHighlight() {
    lastMoveInfo = null;
    if (highlightTimer) { clearTimeout(highlightTimer); highlightTimer = null; }
  }

  // ---------- 绘制 ----------
  function drawBoard() {
    if (!canvas.width) return;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawGrid();
    drawPieces();
    drawLastMoveHighlight();
    if (selectedPiece) {
      const {row, col} = selectedPiece;
      const x = OFFSET_X + col*GRID_SIZE, y = OFFSET_Y + row*GRID_SIZE;
      ctx.save();
      ctx.strokeStyle = '#f5e56b'; ctx.lineWidth = Math.max(2, GRID_SIZE*0.05);
      ctx.shadowBlur = GRID_SIZE*0.1; ctx.shadowColor = 'gold';
      ctx.beginPath(); ctx.arc(x, y, GRID_SIZE*0.48, 0, 2*Math.PI); ctx.stroke();
      ctx.restore();
    }
  }

  function drawLastMoveHighlight() {
    if (!lastMoveInfo) return;
    if (Date.now() - lastMoveInfo.time > 10000) return;
    const { fromX, fromY, toX, toY } = lastMoveInfo;
    const radius = GRID_SIZE * 0.48;
    ctx.save();
    ctx.globalAlpha = 0.45;
    // 起点：浅蓝
    ctx.fillStyle = '#ADD8E6';
    ctx.beginPath();
    ctx.arc(OFFSET_X + fromY*GRID_SIZE, OFFSET_Y + fromX*GRID_SIZE, radius, 0, 2*Math.PI);
    ctx.fill();
    // 终点：亮蓝
    ctx.fillStyle = '#1E90FF';
    ctx.beginPath();
    ctx.arc(OFFSET_X + toY*GRID_SIZE, OFFSET_Y + toX*GRID_SIZE, radius, 0, 2*Math.PI);
    ctx.fill();
    ctx.restore();
  }

  function drawGrid() {
    ctx.save();
    ctx.strokeStyle = '#6b4f32'; ctx.lineWidth = 3;
    for (let i=0; i<ROWS; i++) {
      const y = OFFSET_Y + i*GRID_SIZE;
      ctx.beginPath(); ctx.moveTo(OFFSET_X, y); ctx.lineTo(OFFSET_X+8*GRID_SIZE, y); ctx.stroke();
    }
    for (let i=0; i<COLS; i++) {
      const x = OFFSET_X + i*GRID_SIZE;
      if (i===0 || i===8) {
        ctx.beginPath(); ctx.moveTo(x, OFFSET_Y); ctx.lineTo(x, OFFSET_Y+9*GRID_SIZE); ctx.stroke();
      } else {
        const y1 = OFFSET_Y + 4*GRID_SIZE, y2 = OFFSET_Y + 5*GRID_SIZE;
        ctx.beginPath(); ctx.moveTo(x, OFFSET_Y); ctx.lineTo(x, y1); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x, y2); ctx.lineTo(x, OFFSET_Y+9*GRID_SIZE); ctx.stroke();
      }
    }
    const fontSize = Math.floor(GRID_SIZE*0.7);
    ctx.font = `bold ${fontSize}px "楷体", "KaiTi"`;
    ctx.fillStyle = '#4e2f15'; ctx.globalAlpha = 0.3;
    const centerY = OFFSET_Y + 4.5*GRID_SIZE;
    const centerX = OFFSET_X + 4*GRID_SIZE;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('  楚 河  　 汉 界  ', centerX, centerY);
    ctx.globalAlpha = 1; ctx.textAlign = 'start';
    ctx.beginPath(); ctx.moveTo(OFFSET_X+3*GRID_SIZE, OFFSET_Y); ctx.lineTo(OFFSET_X+5*GRID_SIZE, OFFSET_Y+2*GRID_SIZE); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(OFFSET_X+5*GRID_SIZE, OFFSET_Y); ctx.lineTo(OFFSET_X+3*GRID_SIZE, OFFSET_Y+2*GRID_SIZE); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(OFFSET_X+3*GRID_SIZE, OFFSET_Y+7*GRID_SIZE); ctx.lineTo(OFFSET_X+5*GRID_SIZE, OFFSET_Y+9*GRID_SIZE); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(OFFSET_X+5*GRID_SIZE, OFFSET_Y+7*GRID_SIZE); ctx.lineTo(OFFSET_X+3*GRID_SIZE, OFFSET_Y+9*GRID_SIZE); ctx.stroke();
    ctx.fillStyle = '#6b4f32';
    const d1 = Math.floor(GRID_SIZE*0.09), d2 = Math.floor(GRID_SIZE*0.07);
    for (let r of [2,7]) for (let c of [1,7]) { ctx.beginPath(); ctx.arc(OFFSET_X+c*GRID_SIZE, OFFSET_Y+r*GRID_SIZE, d1, 0, 2*Math.PI); ctx.fill(); }
    for (let r of [3,6]) for (let c of [0,2,4,6,8]) { ctx.beginPath(); ctx.arc(OFFSET_X+c*GRID_SIZE, OFFSET_Y+r*GRID_SIZE, d2, 0, 2*Math.PI); ctx.fill(); }
    ctx.restore();
  }

  function drawPieces() {
    const radius = GRID_SIZE*0.48, fontSize = Math.floor(GRID_SIZE*0.7);
    for (let r=0; r<ROWS; r++) for (let c=0; c<COLS; c++) {
      const p = board[r][c]; if (!p) continue;
      const x = OFFSET_X + c*GRID_SIZE, y = OFFSET_Y + r*GRID_SIZE;
      ctx.save();
      ctx.shadowColor='#333'; ctx.shadowBlur=GRID_SIZE*0.07; ctx.shadowOffsetY=GRID_SIZE*0.03;
      ctx.beginPath(); ctx.arc(x,y,radius,0,2*Math.PI);
      ctx.fillStyle = p[0]==='r' ? '#c33' : '#222'; ctx.fill();
      ctx.shadowBlur=GRID_SIZE*0.04; ctx.strokeStyle='#f1d28c'; ctx.lineWidth=Math.max(1.5, GRID_SIZE*0.04); ctx.stroke();
      ctx.shadowBlur=0; ctx.shadowOffsetY=0;
      ctx.font=`bold ${fontSize}px "楷体","KaiTi","华文楷体",serif`;
      ctx.fillStyle='#FFFFFF'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(pieceToChinese(p), x, y+fontSize*0.1);
      ctx.restore();
    }
  }

  function pieceToChinese(p) {
    const map = {
      'r':{'k':'帅','a':'仕','b':'相','n':'马','r':'车','c':'炮','p':'兵'},
      'b':{'k':'将','a':'士','b':'象','n':'马','r':'车','c':'炮','p':'卒'}
    };
    return map[p[0]][p[1]] || '?';
  }

  // ---------- 规则与AI ----------
  function getPieceRawMoves(boardState, row, col, piece) {
    const color = piece[0]; const type = piece[1]; const moves = [];
    if (type==='k') {
      const pr = color==='r'?[7,8,9]:[0,1,2], pc=[3,4,5];
      for (let [dx,dy] of [[-1,0],[1,0],[0,-1],[0,1]]) {
        const nr=row+dx, nc=col+dy;
        if (pr.includes(nr) && pc.includes(nc)) {
          const t=boardState[nr]?.[nc]; if (!t||t[0]!==color) moves.push({toX:nr,toY:nc});
        }
      }
    } else if (type==='a') {
      const pr = color==='r'?[7,8,9]:[0,1,2], pc=[3,4,5];
      for (let [dx,dy] of [[-1,-1],[-1,1],[1,-1],[1,1]]) {
        const nr=row+dx, nc=col+dy;
        if (pr.includes(nr) && pc.includes(nc)) {
          const t=boardState[nr]?.[nc]; if (!t||t[0]!==color) moves.push({toX:nr,toY:nc});
        }
      }
    } else if (type==='b') {
      for (let [dx,dy] of [[-2,-2],[-2,2],[2,-2],[2,2]]) {
        const nr=row+dx, nc=col+dy;
        if (nr<0||nr>=ROWS||nc<0||nc>=COLS) continue;
        if ((color==='r'&&nr<5)||(color==='b'&&nr>4)) continue;
        if (boardState[row+dx/2][col+dy/2]) continue;
        const t=boardState[nr][nc]; if (!t||t[0]!==color) moves.push({toX:nr,toY:nc});
      }
    } else if (type==='n') {
      for (let [dx,dy] of [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]]) {
        const nr=row+dx, nc=col+dy;
        if (nr<0||nr>=ROWS||nc<0||nc>=COLS) continue;
        let br=row, bc=col;
        if (Math.abs(dx)===2) br = row+(dx>0?1:-1); else bc = col+(dy>0?1:-1);
        if (boardState[br][bc]) continue;
        const t=boardState[nr][nc]; if (!t||t[0]!==color) moves.push({toX:nr,toY:nc});
      }
    } else if (type==='r') {
      for (let [dx,dy] of [[-1,0],[1,0],[0,-1],[0,1]]) {
        let nr=row+dx, nc=col+dy;
        while (nr>=0&&nr<ROWS&&nc>=0&&nc<COLS) {
          const t=boardState[nr][nc];
          if (!t) moves.push({toX:nr,toY:nc});
          else { if (t[0]!==color) moves.push({toX:nr,toY:nc}); break; }
          nr+=dx; nc+=dy;
        }
      }
    } else if (type==='c') {
      for (let [dx,dy] of [[-1,0],[1,0],[0,-1],[0,1]]) {
        let nr=row+dx, nc=col+dy, found=false;
        while (nr>=0&&nr<ROWS&&nc>=0&&nc<COLS) {
          const t=boardState[nr][nc];
          if (!found) {
            if (!t) moves.push({toX:nr,toY:nc}); else found=true;
          } else {
            if (t && t[0]!==color) { moves.push({toX:nr,toY:nc}); break; }
            else if (t) break;
          }
          nr+=dx; nc+=dy;
        }
      }
    } else if (type==='p') {
      const forward = color==='r' ? -1 : 1;
      let nr=row+forward, nc=col;
      if (nr>=0&&nr<ROWS) { const t=boardState[nr][nc]; if (!t||t[0]!==color) moves.push({toX:nr,toY:nc}); }
      if ((color==='r'&&row<=4)||(color==='b'&&row>=5)) {
        for (let dc of [-1,1]) {
          nr=row; nc=col+dc;
          if (nc>=0&&nc<COLS) { const t=boardState[nr][nc]; if (!t||t[0]!==color) moves.push({toX:nr,toY:nc}); }
        }
      }
    }
    return moves;
  }

  function applyMove(boardState, fx, fy, tx, ty) {
    const nb = boardState.map(r=>r.map(c=>c));
    nb[tx][ty] = nb[fx][fy]; nb[fx][fy] = null;
    return nb;
  }

  function isKingInCheck(boardState, color) {
    let king = null;
    for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) {
      const p=boardState[r][c]; if (p&&p[0]===color&&p[1]==='k') king=[r,c];
    }
    if (!king) return false;
    const opp = color==='r'?'b':'r';
    for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) {
      const p=boardState[r][c]; if (p&&p[0]===opp) {
        const raw = getPieceRawMoves(boardState, r, c, p);
        if (raw.some(m=>m.toX===king[0]&&m.toY===king[1])) return true;
      }
    }
    return false;
  }

  function hasGeneralsFacing(boardState) {
    let rk=null, bk=null;
    for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) {
      const p=boardState[r][c];
      if (p&&p[1]==='k') { if (p[0]==='r') rk=[r,c]; else bk=[r,c]; }
    }
    if (!rk||!bk) return false;
    if (rk[1]!==bk[1]) return false;
    const col=rk[1], min=Math.min(rk[0],bk[0]), max=Math.max(rk[0],bk[0]);
    for (let r=min+1; r<max; r++) if (boardState[r][col]) return false;
    return true;
  }

  function getAllValidMoves(boardState, color) {
    const moves = [];
    for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) {
      const p=boardState[r][c]; if (!p||p[0]!==color) continue;
      const raw = getPieceRawMoves(boardState, r, c, p);
      for (let m of raw) {
        const nb = applyMove(boardState, r, c, m.toX, m.toY);
        if (isKingInCheck(nb, color)) continue;
        if (hasGeneralsFacing(nb)) continue;
        moves.push({ fromX:r, fromY:c, toX:m.toX, toY:m.toY,
                     pieceValue: pieceValue[p[1]]||0, targetValue: boardState[m.toX][m.toY] ? (pieceValue[boardState[m.toX][m.toY][1]]||0) : 0 });
      }
    }
    return moves;
  }

  function evaluateBoard(boardState, perspective) {
    let score=0;
    for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) {
      const p=boardState[r][c]; if (!p) continue;
      score += p[0]===perspective ? (pieceValue[p[1]]||0) : -(pieceValue[p[1]]||0);
    }
    return score;
  }

  function alphaBeta(boardState, depth, alpha, beta, maximizing, aiColor, currentDepth) {
    const curColor = maximizing ? aiColor : (aiColor==='r'?'b':'r');
    const moves = getAllValidMoves(boardState, curColor);
    if (moves.length===0) return maximizing ? -Infinity : Infinity;
    if (depth===0) return evaluateBoard(boardState, aiColor);

    const killers = killerMoves[currentDepth] || [null, null];
    moves.sort((a,b)=>{
      const ak = (killers[0]&&a.fromX===killers[0].fromX&&a.fromY===killers[0].fromY&&a.toX===killers[0].toX&&a.toY===killers[0].toY)||
               (killers[1]&&a.fromX===killers[1].fromX&&a.fromY===killers[1].fromY&&a.toX===killers[1].toX&&a.toY===killers[1].toY);
      const bk = (killers[0]&&b.fromX===killers[0].fromX&&b.fromY===killers[0].fromY&&b.toX===killers[0].toX&&b.toY===killers[0].toY)||
               (killers[1]&&b.fromX===killers[1].fromX&&b.fromY===killers[1].fromY&&b.toX===killers[1].toX&&b.toY===killers[1].toY);
      if (ak && !bk) return -1;
      if (!ak && bk) return 1;
      if (a.targetValue !== b.targetValue) return b.targetValue - a.targetValue;
      return b.pieceValue - a.pieceValue;
    });

    if (maximizing) {
      let maxEval = -Infinity;
      for (let m of moves) {
        const nb = applyMove(boardState, m.fromX, m.fromY, m.toX, m.toY);
        const val = alphaBeta(nb, depth-1, alpha, beta, false, aiColor, currentDepth+1);
        maxEval = Math.max(maxEval, val); alpha = Math.max(alpha, val);
        if (beta <= alpha) {
          if (m.targetValue===0) {
            if (!killerMoves[currentDepth]) killerMoves[currentDepth]=[null,null];
            const k = killerMoves[currentDepth];
            if (!k[0]) k[0]=m; else if (!k[1] && !(k[0].fromX===m.fromX&&k[0].fromY===m.fromY&&k[0].toX===m.toX&&k[0].toY===m.toY)) k[1]=m;
          }
          break;
        }
      }
      return maxEval;
    } else {
      let minEval = Infinity;
      for (let m of moves) {
        const nb = applyMove(boardState, m.fromX, m.fromY, m.toX, m.toY);
        const val = alphaBeta(nb, depth-1, alpha, beta, true, aiColor, currentDepth+1);
        minEval = Math.min(minEval, val); beta = Math.min(beta, val);
        if (beta <= alpha) {
          if (m.targetValue===0) {
            if (!killerMoves[currentDepth]) killerMoves[currentDepth]=[null,null];
            const k = killerMoves[currentDepth];
            if (!k[0]) k[0]=m; else if (!k[1] && !(k[0].fromX===m.fromX&&k[0].fromY===m.fromY&&k[0].toX===m.toX&&k[0].toY===m.toY)) k[1]=m;
          }
          break;
        }
      }
      return minEval;
    }
  }

  function getBestMove(boardState, color, depth) {
    initKillers();
    const moves = getAllValidMoves(boardState, color);
    if (moves.length===0) return null;
    let best = [], bestScore = -Infinity;
    for (let m of moves) {
      const nb = applyMove(boardState, m.fromX, m.fromY, m.toX, m.toY);
      const score = alphaBeta(nb, depth-1, -Infinity, Infinity, false, color, 0);
      if (score > bestScore) { bestScore=score; best=[m]; }
      else if (score===bestScore) best.push(m);
    }
    return best[Math.floor(Math.random()*best.length)];
  }

  function aiMakeMove(color) {
    if (gameOver || isAIPlaying) return;
    const isAI = (gameMode==='ai-black'&&color==='b')||(gameMode==='ai-red'&&color==='r');
    if (!isAI) return;
    isAIPlaying = true;
    setTimeout(()=>{
      if (gameOver) { isAIPlaying=false; return; }
      const move = getBestMove(board, color, aiDifficulty);
      if (!move) {
        gameOver=true; winner = (color==='r'?'b':'r');
        turnText.innerText = (winner==='r'?'红方胜':'黑方胜');
        drawBoard(); isAIPlaying=false; return;
      }
      const { fromX, fromY, toX, toY } = move;
      const boardCopy = board.map(r=>r.map(c=>c));
      history.push({ board:boardCopy, currentPlayer });
      if (history.length > MAX_HISTORY) history.shift();

      const piece = board[fromX][fromY];
      board[toX][toY] = piece; board[fromX][fromY] = null;
      const enemy = color==='r'?'b':'r';
      let kingAlive = false;
      for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) {
        if (board[r][c]&&board[r][c][0]===enemy&&board[r][c][1]==='k') kingAlive=true;
      }
      if (!kingAlive) { gameOver=true; winner=color; turnText.innerText = (winner==='r'?'红方胜':'黑方胜'); }
      else { currentPlayer = enemy; turnText.innerText = currentPlayer==='r'?'红方走棋':'黑方走棋'; }
      selectedPiece = null;

      setMoveHighlight(fromX, fromY, toX, toY);
      drawBoard();

      if (!gameOver) {
        const nextAI = (gameMode==='ai-black'&&currentPlayer==='b')||(gameMode==='ai-red'&&currentPlayer==='r');
        if (nextAI) setTimeout(()=>aiMakeMove(currentPlayer), 150);
      }
      isAIPlaying = false;
    }, 150);
  }

  // ---------- 玩家交互 ----------
  function handleCanvasClick(e) {
    if (gameOver) return;
    const isAI = (gameMode==='ai-black'&&currentPlayer==='b')||(gameMode==='ai-red'&&currentPlayer==='r');
    if (isAI) return;

    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width/rect.width, scaleY = canvas.height/rect.height;
    const mx = (e.clientX-rect.left)*scaleX, my = (e.clientY-rect.top)*scaleY;
    const col = Math.round((mx-OFFSET_X)/GRID_SIZE), row = Math.round((my-OFFSET_Y)/GRID_SIZE);
    if (row<0||row>=ROWS||col<0||col>=COLS) return;

    if (!selectedPiece) {
      const p = board[row][col];
      if (p && p[0]===currentPlayer) selectedPiece = { row, col, piece: p };
    } else {
      const { row:sr, col:sc, piece:sp } = selectedPiece;
      if (board[row][col] && board[row][col][0]===currentPlayer) {
        selectedPiece = { row, col, piece: board[row][col] }; drawBoard(); return;
      }
      const raw = getPieceRawMoves(board, sr, sc, sp);
      let valid = false;
      for (let m of raw) {
        if (m.toX===row && m.toY===col) {
          const nb = applyMove(board, sr, sc, row, col);
          if (!isKingInCheck(nb, currentPlayer) && !hasGeneralsFacing(nb)) valid = true;
          break;
        }
      }
      if (valid) {
        const boardCopy = board.map(r=>r.map(c=>c));
        history.push({ board:boardCopy, currentPlayer });
        if (history.length > MAX_HISTORY) history.shift();

        const piece = board[sr][sc];
        board[row][col] = piece; board[sr][sc] = null;
        const enemy = currentPlayer==='r'?'b':'r';
        let kingAlive = false;
        for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) {
          if (board[r][c]&&board[r][c][0]===enemy&&board[r][c][1]==='k') kingAlive=true;
        }
        if (!kingAlive) { gameOver=true; winner=currentPlayer; turnText.innerText = (winner==='r'?'红方胜':'黑方胜'); }
        else { currentPlayer = enemy; turnText.innerText = currentPlayer==='r'?'红方走棋':'黑方走棋'; }
        selectedPiece = null;
        drawBoard();
        if (!gameOver) {
          const nextAI = (gameMode==='ai-black'&&currentPlayer==='b')||(gameMode==='ai-red'&&currentPlayer==='r');
          if (nextAI) setTimeout(()=>aiMakeMove(currentPlayer), 200);
        }
      } else {
        selectedPiece = null;
      }
    }
    drawBoard();
  }

  // 悔棋：各退一步 (撤销AI步+玩家步)
  function undoMove() {
    if (gameOver || isAIPlaying) return;
    // 需要轮到玩家走棋 且 历史记录至少2条 (AI步+玩家步)
    if (history.length < 2) return;
    if (undoCount >= MAX_UNDO) return;

    // 弹出AI步
    history.pop();
    // 弹出玩家步
    const playerMove = history.pop();
    board = playerMove.board.map(r=>r.map(c=>c));
    currentPlayer = playerMove.currentPlayer;
    selectedPiece = null;
    gameOver = false; winner = null;
    turnText.innerText = currentPlayer==='r'?'红方走棋':'黑方走棋';

    undoCount++;
    updateUndoButton();
    clearHighlight();
    drawBoard();

    // 悔棋后轮到玩家，不需要AI走
  }

  function restartGame() {
    if (isAIPlaying) return;
    initBoard();
    resizeCanvas();
    if ((gameMode==='ai-black'&&currentPlayer==='b')||(gameMode==='ai-red'&&currentPlayer==='r')) aiMakeMove(currentPlayer);
  }

  canvas.addEventListener('click', handleCanvasClick);
  undoBtn.addEventListener('click', undoMove);
  restartBtn.addEventListener('click', restartGame);
  modeSelect.addEventListener('change', (e)=>{ gameMode=e.target.value; restartGame(); });
  difficultySelect.addEventListener('change', (e)=>{ aiDifficulty=parseInt(e.target.value); });

  initBoard();
  resizeCanvas();
  if ((gameMode==='ai-black'&&currentPlayer==='b')||(gameMode==='ai-red'&&currentPlayer==='r')) aiMakeMove(currentPlayer);
})();
</script>
